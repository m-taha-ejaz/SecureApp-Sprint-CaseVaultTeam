name: CaseVault CI and Security Gates
on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-security.txt
      - name: Compile hardened native validator
        run: sh scripts/build_native.sh
      - name: Static check - prohibited C APIs in deployed validator
        run: |
          if grep -nE "(strcpy|strcat|sprintf|gets)\s*\(" native/safe_filename.c; then
            echo "Unsafe C function found" && exit 1
          fi
      - name: Execute integration security regression tests
        run: pytest -q tests
      - name: Run Semgrep SAST on deployable application
        run: |
          mkdir -p reports
          semgrep scan --config security/semgrep-rules.yml --json --output reports/semgrep.json secureapp/ scripts/critical_gate.py
          python scripts/critical_gate.py reports/semgrep.json
      - name: Prove high-severity gate blocks broken policy
        run: |
          python scripts/critical_gate.py security/gate-fixture-clean.json
          if python scripts/critical_gate.py security/gate-fixture-high.json; then
            echo 'ERROR: gate allowed a high finding' && exit 1
          fi
          echo 'PASS: high finding rejected by policy gate'
      - name: Evidence demo (controlled, offline)
        run: python scripts/demo_security.py
      - name: Upload SAST + demonstration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            reports/
            evidence/*.txt
  dast-zap:
    runs-on: ubuntu-latest
    needs: test-and-security
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app requirements
        run: pip install -r requirements.txt
      - name: Build validator and launch test server
        env:
          APP_SECRET: ci-internal-only-long-random-like-secret-never-production
        run: |
          sh scripts/build_native.sh
          python -c 'from secureapp import create_app; app=create_app(); import uvicorn; uvicorn.run(app,host="127.0.0.1",port=8000)' > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/health && break || sleep 1; done
          curl --fail http://127.0.0.1:8000/login
      - name: Start isolated intentionally insecure baseline for before/after DAST
        run: |
          python -m uvicorn lab.vulnerable_site:app --host 127.0.0.1 --port 8001 > /tmp/lab-web.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8001/ && break || sleep 1; done
      - name: ZAP baseline DAST - BEFORE (isolated lab page)
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8001 -m 1 -I -J zap-before.json -r zap-before.html
      - name: ZAP baseline passive DAST - AFTER (secured app, unauthenticated)
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -m 1 -I -J zap-after.json -r zap-after.html
      - name: DAST severity gate for secured app
        run: python scripts/zap_gate.py reports/zap-after.json
      - name: Upload DAST reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-evidence
          path: |
            reports/zap-*
            /tmp/web.log
            /tmp/lab-web.log
