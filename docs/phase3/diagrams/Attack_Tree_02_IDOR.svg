<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="920" viewBox="0 0 1560 920"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#607487" stroke-width="1.5"/></marker><marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#C65D4D" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="780" y="50" font-family="DejaVu Sans" text-anchor="middle" font-weight="bold" font-size="33" fill="#172A3A">AT-02 · UNAUTHORIZED EVIDENCE EXPOSURE OR ALTERATION</text><rect x="355" y="89" width="850" height="98" rx="16" fill="#F8D9D2" stroke="#C65D4D" stroke-width="2"/><text x="780.0" y="124.0" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" fill="#20394E">ATTACKER GOAL</text><text x="780.0" y="154.0" font-family="DejaVu Sans" font-size="23" text-anchor="middle" fill="#3A5568">read, share or delete evidence without current permission</text><rect x="656" y="230" width="245" height="75" rx="16" fill="#FFF0DC" stroke="#B87726" stroke-width="2"/><text x="778.5" y="267.5" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" fill="#20394E">OR  |  any route</text><line x1="780" y1="187" x2="780" y2="230" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M780,305 L780,341 L285,341 L285,378" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M780,305 L780,378" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M780,305 L780,341 L1275,341 L1275,378" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="45" y="378" width="480" height="77" rx="16" fill="#FFE8DE" stroke="#C65D4D" stroke-width="2"/><text x="285.0" y="416.5" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#20394E">AND | all preconditions</text><rect x="45" y="487" width="480" height="235" rx="16" fill="#FFF4F2" stroke="#D27B6D" stroke-width="2"/><text x="285.0" y="562.5" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#20394E">Path A · Direct IDOR</text><text x="285.0" y="592.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">1. Authenticated limited user</text><text x="285.0" y="622.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">2. Knows/guesses evidence ID</text><text x="285.0" y="652.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">3. Object ACL check is missing</text><line x1="285" y1="455" x2="285" y2="485" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="540" y="378" width="480" height="77" rx="16" fill="#FFE8DE" stroke="#C65D4D" stroke-width="2"/><text x="780.0" y="416.5" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#20394E">AND | all preconditions</text><rect x="540" y="487" width="480" height="235" rx="16" fill="#FFF4F2" stroke="#D27B6D" stroke-width="2"/><text x="780.0" y="562.5" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#20394E">Path B · Revoked access</text><text x="780.0" y="592.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">1. User was previously granted</text><text x="780.0" y="622.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">2. Owner revokes access</text><text x="780.0" y="652.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">3. Server reuses stale grant</text><line x1="780" y1="455" x2="780" y2="485" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1035" y="378" width="480" height="77" rx="16" fill="#FFE8DE" stroke="#C65D4D" stroke-width="2"/><text x="1275.0" y="416.5" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#20394E">AND | all preconditions</text><rect x="1035" y="487" width="480" height="235" rx="16" fill="#FFF4F2" stroke="#D27B6D" stroke-width="2"/><text x="1275.0" y="562.5" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#20394E">Path C · Insecure mutation</text><text x="1275.0" y="592.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">1. Attacker selects another ID</text><text x="1275.0" y="622.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">2. Server checks login only</text><text x="1275.0" y="652.5" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#3A5568">3. Share/delete permission omitted</text><line x1="1275" y1="455" x2="1275" y2="485" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="250" y="776" width="1060" height="99" rx="16" fill="#DAF0E9" stroke="#176F75" stroke-width="2"/><text x="780.0" y="811.5" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" fill="#20394E">DEFENSES BLOCK ALL ROUTES</text><text x="780.0" y="841.5" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#3A5568">per-object owner/grant authorization • live revocation • deny by default • audit</text></svg>