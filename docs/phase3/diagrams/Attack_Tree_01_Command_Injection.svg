<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="880" viewBox="0 0 1560 880"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#607487" stroke-width="1.5"/></marker><marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#C65D4D" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="780" y="54" font-family="DejaVu Sans" text-anchor="middle" font-weight="bold" font-size="33" fill="#172A3A">AT-01 · COMMAND INJECTION THROUGH EVIDENCE METADATA</text><rect x="344" y="95" width="872" height="98" rx="16" fill="#F8D9D2" stroke="#C65D4D" stroke-width="2"/><text x="780.0" y="130.0" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" fill="#20394E">ATTACKER GOAL</text><text x="780.0" y="160.0" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#3A5568">execute an unintended OS command through the legacy upload path</text><rect x="630" y="235" width="300" height="78" rx="16" fill="#FFE8DE" stroke="#C65D4D" stroke-width="2"/><text x="780.0" y="274.0" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle" fill="#20394E">AND  |  all needed</text><line x1="780" y1="193" x2="780" y2="235" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="53" y="396" width="478" height="112" rx="16" fill="#FFF4F2" stroke="#D27B6D" stroke-width="2"/><text x="292.0" y="438.0" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#20394E">A · Reachable input</text><text x="292.0" y="468.0" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#3A5568">authenticated user can submit metadata</text><rect x="541" y="396" width="478" height="112" rx="16" fill="#FFF4F2" stroke="#D27B6D" stroke-width="2"/><text x="780.0" y="438.0" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#20394E">B · Unsafe invocation</text><text x="780.0" y="468.0" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#3A5568">metadata embedded in a shell string</text><rect x="1029" y="396" width="478" height="112" rx="16" fill="#FFF4F2" stroke="#D27B6D" stroke-width="2"/><text x="1268.0" y="438.0" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#20394E">C · Shell interpretation</text><text x="1268.0" y="468.0" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#3A5568">shell treats untrusted text as commands</text><path d="M780,313 L780,353 L292,353 L292,396" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M780,313 L780,396" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M780,313 L780,353 L1268,353 L1268,396" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="624" y="552" width="312" height="75" rx="16" fill="#FFF0DC" stroke="#B87726" stroke-width="2"/><text x="780.0" y="589.5" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle" fill="#20394E">OR  |  unsafe API</text><line x1="780" y1="508" x2="780" y2="552" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="370" y="672" width="380" height="75" rx="16" fill="#FFF2E3" stroke="#B87726" stroke-width="2"/><text x="560.0" y="709.5" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#20394E">shell=True with interpolation</text><rect x="810" y="672" width="380" height="75" rx="16" fill="#FFF2E3" stroke="#B87726" stroke-width="2"/><text x="1000.0" y="709.5" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#20394E">system() / popen() shell string</text><path d="M780,627 L780,644 L560,644 L560,672" fill="none" stroke="#607487" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M7